name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run check
      - name: No runtime dependencies
        run: node -e "const d=Object.keys(require('./package.json').dependencies||{}); if(d.length){console.error('runtime dependencies:',d); process.exit(1)}"
      - run: npm pack --dry-run
